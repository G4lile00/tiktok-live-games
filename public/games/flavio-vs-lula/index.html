<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flávio x Lula - TikTok Live Games</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Popups "+N" (Canvas) — drawn on top of the stage -->
    <canvas id="duelCanvas"></canvas>

    <!-- HUD Overlay (DOM). The stage keeps a 4:3 ratio and scales with the screen -->
    <div id="hud">
      <div id="stage">
        <!-- Phase Banner -->
        <div id="phaseBanner" class="phase-banner">
          <span id="gameTitle" class="game-title"></span>
          <span id="phaseText"></span>
          <span id="phaseTimer"></span>
        </div>

        <!-- Status bar: TOTAL | DIFERENÇA | "NN NA FRENTE" -->
        <div id="statusBar" class="status-bar">
          <div class="stat">
            <span id="totalLabel" class="stat-label"></span>
            <span id="totalScore" class="stat-value">0</span>
          </div>
          <div class="stat">
            <span id="diffLabel" class="stat-label"></span>
            <span id="diffScore" class="stat-value">0</span>
          </div>
          <div id="leaderPill" class="leader-pill"></div>
        </div>

        <!-- Score cards (left = blue, right = red) -->
        <div id="sideCards"></div>

        <!-- Voting machines (urnas) with the typing hand -->
        <div id="urns"></div>

        <!-- Event Feed (bottom) -->
        <div id="eventFeed"></div>

        <!-- Result Overlay (hidden until the round ends) -->
        <div id="winnerOverlay" class="winner-overlay hidden">
          <div class="winner-content">
            <div id="winnerBadge" class="winner-badge"></div>
            <div id="winnerName" class="winner-name"></div>
            <div id="winnerScore" class="winner-score"></div>
            <div id="winnerSupporters" class="winner-supporters"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Dependencies -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/lib/tiktok-bridge.js"></script>
    <script src="config.js"></script>
    <script src="duel-engine.js"></script>
    <script src="game.js"></script>
  </body>
</html>
